name: Update Market Data

on:
  schedule:
    # Runs Monday to Friday every 6 hours (financial markets are closed on weekends)
    - cron: "0 */6 * * 1-5"
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Fetch Data
        run: python scripts/fetch_data.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'Bernardo Martins (Bot)'
          git config --global user.email 'bernam07@users.noreply.github.com'
          git add assets/data/market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data 📈" && git push)
